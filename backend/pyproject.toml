[project]
name = "roompact-campus"
version = "0.1.0"
description = "RoomPACT Campus main and AI backend services"
requires-python = ">=3.12"
dependencies = [
  "boto3==1.43.81",
  "fastapi==0.118.0",
  "httpx==0.28.1",
  "networkx==3.6.1",
  "psycopg[binary]==3.2.12",
  "uvicorn==0.37.0",
  "websockets==15.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.13.0",
]

[tool.pytest.ini_options]
pythonpath = [
  "src",
]
testpaths = [
  "tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
