[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "roompact-campus"
version = "0.1.0"
description = "RoomPACT Campus hackathon scaffold"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.35,<2",
  "networkx>=3.4,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.setuptools]
py-modules = [
  "handler",
  "scoring",
  "matching",
  "scenario",
  "negotiate",
  "pact",
  "llm_client",
  "fallback",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
